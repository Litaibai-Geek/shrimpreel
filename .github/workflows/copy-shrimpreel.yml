name: One-time copy of shrimpreel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  copy:
    if: github.event.head_commit.message == 'chore: add temporary shrimpreel copy workflow'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Copy source repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/Litaibai-Geek/shrimpreel.git /tmp/shrimpreel
          rsync -a --exclude='.git/' /tmp/shrimpreel/ ./
          rm -f .github/workflows/copy-shrimpreel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to copy."
            exit 0
          fi
          git commit -m "chore: copy shrimpreel snapshot for Tiny Desk AI"
          git push origin HEAD:main
